name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check project files
        run: |
          ls -la
          test -f pubspec.yaml
          test -d lib

      - name: Create Android platform files
        run: flutter create --project-name orbitplan --org com.orbitplan --platforms=android .

      - name: Get dependencies
        run: flutter pub get

      - name: Patch Android files
        run: python3 tools/patch_android.py

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Build debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OrbitPlan-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
