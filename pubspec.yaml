name: orbitplan
version: 1.0.0+1
publish_to: 'none'
description: Offline life planner for habits, tasks, finance and notes.

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  intl: ^0.19.0
  flutter_timezone: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  image_path: assets/icon.png
  adaptive_icon_background: '#07080D'
  adaptive_icon_foreground: assets/icon.png
  min_sdk_android: 23
